<h2>页面布局方案 — 四页核心设计</h2>
<p class="subtitle">创意工作室风格下，每个页面的布局与交互框架</p>

<div class="section">
  <h3>1. 工作台 → 数据工作室</h3>
  <div class="mockup" style="margin-bottom:12px">
    <div class="mockup-body" style="padding:12px;text-align:left">
      <div style="display:flex;gap:12px;margin-bottom:12px">
        <div style="flex:1;height:80px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:8px;padding:12px;color:#fff">
          <div style="font-size:12px;opacity:0.8">今日产出</div>
          <div style="font-size:24px;font-weight:700">12</div>
        </div>
        <div style="flex:1;height:80px;background:#1a1a23;border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:12px;color:#94a3b8">素材总数</div>
          <div style="font-size:24px;font-weight:700;color:#fff">128</div>
        </div>
        <div style="flex:1;height:80px;background:#1a1a23;border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:12px;color:#94a3b8">视频产出</div>
          <div style="font-size:24px;font-weight:700;color:#fff">34</div>
        </div>
        <div style="flex:1;height:80px;background:#1a1a23;border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:12px;color:#94a3b8">转化率</div>
          <div style="font-size:24px;font-weight:700;color:#10b981">+12.5%</div>
        </div>
      </div>
      <div style="display:flex;gap:12px">
        <div style="flex:2;height:160px;background:#1a1a23;border-radius:8px;border:1px solid rgba(255,255,255,0.06)"></div>
        <div style="flex:1;height:160px;background:#1a1a23;border-radius:8px;border:1px solid rgba(255,255,255,0.06)"></div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>2. 素材库 → 媒体库</h3>
  <div class="mockup" style="margin-bottom:12px">
    <div class="mockup-body" style="padding:12px;text-align:left">
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <div style="padding:6px 14px;background:#1a1a23;border-radius:20px;font-size:12px;color:#fff;border:1px solid rgba(255,255,255,0.06)">全部</div>
        <div style="padding:6px 14px;background:#6366f1;border-radius:20px;font-size:12px;color:#fff">图片</div>
        <div style="padding:6px 14px;background:#1a1a23;border-radius:20px;font-size:12px;color:#94a3b8;border:1px solid rgba(255,255,255,0.06)">视频</div>
        <div style="padding:6px 14px;background:#1a1a23;border-radius:20px;font-size:12px;color:#94a3b8;border:1px solid rgba(255,255,255,0.06)">音频</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        <div style="height:100px;background:#1a1a23;border-radius:8px;border:1px solid rgba(255,255,255,0.06)"></div>
        <div style="height:100px;background:#1a1a23;border-radius:8px;border:1px solid rgba(255,255,255,0.06)"></div>
        <div style="height:100px;background:#1a1a23;border-radius:8px;border:1px solid rgba(255,255,255,0.06)"></div>
        <div style="height:100px;background:#1a1a23;border-radius:8px;border:1px solid rgba(255,255,255,0.06)"></div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>3. 创作页 → 视频工作室 (三栏布局)</h3>
  <div class="mockup">
    <div class="mockup-body" style="padding:12px;text-align:left">
      <div style="display:flex;gap:12px;height:300px">
        <div style="width:240px;background:#1a1a23;border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.06);flex-shrink:0">
          <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">创作配置</div>
          <div style="height:30px;background:#24242f;border-radius:4px;margin-bottom:6px"></div>
          <div style="height:30px;background:#24242f;border-radius:4px;margin-bottom:6px"></div>
          <div style="height:80px;background:#24242f;border-radius:4px;margin-bottom:6px"></div>
        </div>
        <div style="flex:1;background:#1a1a23;border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">预览</div>
          <div style="width:180px;height:320px;background:#0f0f13;border-radius:8px;margin:0 auto;border:1px solid rgba(255,255,255,0.06)"></div>
        </div>
        <div style="width:320px;background:#1a1a23;border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,0.06);flex-shrink:0">
          <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">时间轴</div>
          <div style="display:flex;gap:4px;height:60px">
            <div style="flex:1;background:#24242f;border-radius:4px"></div>
            <div style="flex:1;background:#6366f1;border-radius:4px"></div>
            <div style="flex:1;background:#24242f;border-radius:4px"></div>
            <div style="flex:1;background:#24242f;border-radius:4px"></div>
            <div style="flex:1;background:#24242f;border-radius:4px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
