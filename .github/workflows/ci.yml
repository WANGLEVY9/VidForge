name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
        name: Install dependencies

      - run: pnpm --filter @vidforge/frontend lint
        name: Lint (frontend)

      - run: pnpm --filter @vidforge/backend build
        name: Build (backend)

      - run: pnpm --filter @vidforge/frontend build
        name: Build (frontend)
