name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm audit --prod --audit-level=high
        name: Audit production dependencies
      - run: pnpm docs:check
        name: Check local documentation links
      - run: pnpm check:hygiene
        name: Check repository hygiene
      - run: docker compose config --quiet
        name: Validate Docker Compose configuration
      - run: pnpm test
        name: Run repository tests
      - run: pnpm --filter @vidforge/frontend lint
        name: Lint frontend
      - run: pnpm --filter @vidforge/backend lint
        name: Lint backend
      - run: pnpm stylelint
        name: Lint stylesheets

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm --filter @vidforge/backend build
        name: Build backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm --filter @vidforge/frontend build
        name: Build frontend
      - run: pnpm check:bundle
        name: Enforce frontend bundle budgets

  checkpointer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vidforge
          POSTGRES_PASSWORD: vidforge
          POSTGRES_DB: vidforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidforge -d vidforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vidforge:vidforge@localhost:5432/vidforge
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm checkpointer:setup
        name: Initialize LangGraph checkpoint schema
      - run: pnpm checkpointer:smoke
        name: Verify node-level resume
