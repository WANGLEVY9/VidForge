# Railway / Nixpacks 仅用于构建并运行 backend。
# 前端在 Vercel 单独部署，无需在此构建。
# 注意：Railway 服务面板中的 Custom Build/Install/Start Command
# 必须保持为空，否则会覆盖此文件。

[phases.setup]
# nodejs_20  Node 运行时
# npm-10_x   npm 包管理
# ffmpeg     视频合片 / 导出转码 / 抽帧 / 字幕烧录(MediaModule 必需)
nixPkgs = ['nodejs_20', 'npm-10_x', 'ffmpeg']

[phases.install]
cmds = [
  "cd apps/backend && npm install --include=dev --legacy-peer-deps --no-audit --no-fund"
]

[phases.build]
cmds = [
  "cd apps/backend && npm run build"
]

[start]
cmd = "cd apps/backend && npm run start:prod"
